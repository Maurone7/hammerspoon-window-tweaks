name: Lint and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1
        with:
          args: Spoons tests

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4 (the version Hammerspoon uses)
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run unit tests
        run: lua5.4 tests/run.lua
